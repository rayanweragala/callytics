[global]
type = global
endpoint_identifier_order = username,ip,anonymous

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5080
#tryinclude pjsip_relay.conf

[transport-tcp]
type = transport
protocol = tcp
bind = 0.0.0.0:5080

#tryinclude pjsip_webrtc.conf

[callytics-endpoint-template](!)
type = endpoint
context = callytics-inbound
disallow = all
allow = opus
allow = ulaw
allow = alaw
direct_media = no
force_rport = yes
rewrite_contact = yes
rtp_symmetric = yes

#tryinclude pjsip_callytics_extensions.conf
#tryinclude pjsip_callytics_trunks.conf
